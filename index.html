<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash World - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <main class="container narrow">
        <header><h1>CIPHER RELAY</h1><p class="subtitle">SECURE TERMINAL V1.0.0</p></header>
        <section class="terminal-box">
            <p class="eyebrow">IDENTITY VERIFICATION</p>
            <h2>Enter the relay</h2>
            <p class="intro">Your name and email identify your leaderboard entry.</p>
            <form id="login-form" novalidate>
                <label for="name">USERNAME</label>
                <input id="name" name="name" type="text" placeholder="ENTER YOUR NAME" autocomplete="name" required>
                <label for="email">EMAIL</label>
                <input id="email" name="email" type="email" placeholder="ENTER YOUR EMAIL" autocomplete="email" required>
                <p class="warning">Your name will be displayed on the leaderboard and cannot be changed while playing. Check it carefully before continuing.</p>
                <button type="submit" id="login-btn">ENTER RELAY</button>
                <p id="feedback" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
