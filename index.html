<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash World - Cipher Relay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header>
            <h1> CIPHER RELAY</h1>
            <p class="subtitle">SECURE TERMINAL V1.0.0</p>
        </header>

        <div id="game-box" class="terminal-box">
            <div id="level-display">
                <span class="badge">LEVEL <span id="current-level">1</span>/3</span>
                <div id="timer">TIME: <span id="time-left">600</span>s</div>
            </div>

            <div id="challenge-container">
                <!-- Dynamically loaded via script.js -->
            </div>

            <div class="input-group">
                <input type="text" id="user-input" placeholder="ENTER DECRYPTED CODE..." autocomplete="off">
                <button id="submit-btn" onclick="verifyAnswer()">TRANSMIT</button>
            </div>
            <p id="feedback"></p>
        </div>

        <div id="win-screen" class="terminal-box hidden">
            <h2>ACCESS GRANTED</h2>
            <p>Transmission successfully decrypted.</p>
            <div class="stats">
                <p>Final Time: <span id="final-time">0</span> seconds</p>
            </div>
            <button onclick="location.reload()">RESTART SYSTEM</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
